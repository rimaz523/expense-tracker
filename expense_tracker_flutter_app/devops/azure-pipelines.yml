trigger:
  branches:
    include:
      - master

variables:
  - template: variables/build.yml
  - template: variables/deploy.yml

name : $(majorVersion).$(minorVersion).$(patchVersion)+$(Build.BuildId)

stages:
  - stage: 'Build'
    pool:
      vmImage: '$(buildImage)'
    displayName: 'Build the flutter iOS & Android apps'
    jobs:
      - job: 'Build'
        displayName: 'Build job'
        steps:
          - template: './steps/build.yml'
            parameters:
              buildVersionNumber: '$(majorVersion).$(minorVersion).$(patchVersion)'
              buildVersionCode: '$(Build.BuildId)'

  - stage: 'Distribute'
    dependsOn: 'Build'
    condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'master'))
    pool:
      vmImage: '$(deployImage)'
    displayName: 'Distribute to Firebase'
    variables:
      - group: FlutterDistributionVars
    jobs:
      - deployment: 'Deploy'
        displayName: 'Deploy job'
        environment: DEV
        strategy:
          runOnce:
            deploy:
              steps:
                - template: './steps/deploy.yml'
