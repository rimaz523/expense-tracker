trigger:
  branches:
    include:
      - master

variables:
  - template: variables/build.yml
  - template: variables/deploy.yml

stages:
  - stage: 'Build'
    pool: '$(buildImage)'
    displayName: 'Build the flutter iOS & Android apps'
    jobs:
      - job: 'Build'
        displayName: 'Build job'
        steps:
          - template: './steps/build.yml'

  - stage: 'Distribute'
    pool: '$(deployImage)'
    displayName: 'Distribute to Firebase'
    dependsOn: 'Build'
    variables:
      - group: FlutterDistributionVars
    condition: and (succeeded(), eq(variables['Build.SourceBranchName'], 'master'))
    jobs:
      - deployment: 'Deploy'
        displayName: 'Deploy job'
        environment: DEV
        strategy:
          runOnce:
            deploy:
              steps:
                - template: './steps/deploy.yml'
